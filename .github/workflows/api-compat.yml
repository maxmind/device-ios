name: API Compatibility

on: [push, pull_request]

permissions: {}

jobs:
  check-api-compat:
    name: Check for API Breaking Changes
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Build
        run: |
          xcodebuild build \
            -scheme MinFraudDevice \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/api-compat \
            ONLY_ACTIVE_ARCH=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Check API compatibility
        run: |
          DIAGS=$(xcrun swift-api-digester -diagnose-sdk \
            -module MinFraudDevice \
            -baseline-path api-baseline.json \
            -sdk "$(xcrun --show-sdk-path --sdk iphonesimulator)" \
            -target arm64-apple-ios15.0-simulator \
            -I .build/api-compat/Build/Products/Debug-iphonesimulator \
            -swift-only \
            -compiler-style-diags 2>&1)

          if echo "$DIAGS" | grep -q "API breakage:"; then
            echo "::error::API breaking changes detected:"
            echo "$DIAGS" | grep "API breakage:"
            echo ""
            echo "If this change is intentional, update api-baseline.json in your PR by"
            echo "regenerating it with xcrun swift-api-digester -dump-sdk."
            exit 1
          fi

          echo "No API breaking changes detected."
