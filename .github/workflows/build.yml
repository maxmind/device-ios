name: Swift

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: macos-latest
    strategy:
      matrix:
        xcode: ["15.2", "15.4"]
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      - name: Build & Test Package
        run: swift test