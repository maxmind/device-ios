name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-14

    strategy:
      matrix:
        xcode: ['15.2']
        destination:
          - 'platform=iOS Simulator,name=iPhone 15,OS=17.2'
          - 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.2'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Show available SDKs
      run: xcodebuild -showsdks

    - name: Build Swift Package
      run: swift build -v

    - name: Run Tests
      run: |
        xcodebuild test \
          -scheme MinFraudDevice \
          -destination "${{ matrix.destination }}" \
          -enableCodeCoverage YES \
          | xcpretty && exit ${PIPESTATUS[0]}
      continue-on-error: false

    - name: Upload Code Coverage
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: false
        verbose: true
      if: matrix.destination == 'platform=iOS Simulator,name=iPhone 15,OS=17.2'

  lint:
    name: SwiftLint
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install SwiftLint
      run: brew install swiftlint

    - name: Run SwiftLint
      run: swiftlint lint --reporter github-actions-logging

  build-documentation:
    name: Build Documentation
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

    - name: Build Documentation
      run: |
        swift package --allow-writing-to-directory ./docs \
          generate-documentation --target MinFraudDevice \
          --output-path ./docs \
          --transform-for-static-hosting \
          --hosting-base-path device-ios

    - name: Upload Documentation Artifact
      uses: actions/upload-artifact@v7
      with:
        name: documentation
        path: docs/
        retention-days: 30

  check-privacy-manifest:
    name: Check Privacy Manifest
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify Privacy Manifest Exists
      run: |
        if [ ! -f "Sources/MinFraudDevice/PrivacyInfo.xcprivacy" ]; then
          echo "Error: Privacy Manifest not found"
          exit 1
        fi
        echo "Privacy Manifest found"

    - name: Validate Privacy Manifest Format
      run: |
        plutil -lint Sources/MinFraudDevice/PrivacyInfo.xcprivacy
        echo "Privacy Manifest is valid"
