name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 12 * * 1" # Mondays at 12:00 UTC

permissions: {}

jobs:
  build-and-test:
    name: Build and Test (iOS ${{ matrix.ios-version }})
    runs-on: ${{ matrix.runner-image }}
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - runner-image: "macos-14"
            ios-version: "17.5"
            xcode-version: "15.4"
            destination: "platform=iOS Simulator,name=iPhone 15,OS=17.5"
          - runner-image: "macos-15"
            ios-version: "18.5"
            xcode-version: "16.4"
            destination: "platform=iOS Simulator,name=iPhone 16,OS=18.5"
          - runner-image: "macos-26"
            ios-version: "26.5"
            xcode-version: "26.3"
            destination: "platform=iOS Simulator,name=iPhone 17,OS=26.5"

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Xcode ${{ matrix.xcode-version }}
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ matrix.xcode-version }}

      - name: Warm up CoreSimulator
        run: xcrun simctl list devices available

      - name: Run Tests
        run: |
          attempts=3
          status=1
          for attempt in $(seq 1 $attempts); do
            echo "::group::Test attempt $attempt of $attempts"
            rm -rf TestResults-iOS${{ matrix.ios-version }}.xcresult
            set +e
            xcodebuild test \
              -scheme MinFraudDevice \
              -destination "${{ matrix.destination }}" \
              -resultBundlePath TestResults-iOS${{ matrix.ios-version }}.xcresult \
              | xcpretty
            status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            if [ $status -eq 0 ]; then
              exit 0
            fi
            echo "Test attempt $attempt failed with exit code $status"
          done
          exit $status

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-ios-${{ matrix.ios-version }}
          path: TestResults-iOS${{ matrix.ios-version }}.xcresult
          retention-days: 14

  build-example-app:
    name: Build Example App (iOS ${{ matrix.ios-version }})
    runs-on: ${{ matrix.runner-image }}
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - runner-image: "macos-14"
            ios-version: "17.5"
            xcode-version: "15.4"
            destination: "platform=iOS Simulator,name=iPhone 15,OS=17.5"
          - runner-image: "macos-15"
            ios-version: "18.5"
            xcode-version: "16.4"
            destination: "platform=iOS Simulator,name=iPhone 16,OS=18.5"
          - runner-image: "macos-26"
            ios-version: "26.5"
            xcode-version: "26.3"
            destination: "platform=iOS Simulator,name=iPhone 17,OS=26.5"

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Xcode ${{ matrix.xcode-version }}
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ matrix.xcode-version }}

      - name: Warm up CoreSimulator
        run: xcrun simctl list devices available

      - name: Build Example App
        run: |
          attempts=3
          status=1
          for attempt in $(seq 1 $attempts); do
            echo "::group::Test attempt $attempt of $attempts"
            rm -rf TestResults-iOS${{ matrix.ios-version }}.xcresult
            set +e
            xcodebuild build \
              -project Example/MinFraudDeviceExample/MinFraudDeviceExample.xcodeproj \
              -scheme MinFraudDeviceExample \
              -destination "${{ matrix.destination }}" \
              | xcpretty
            status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            if [ $status -eq 0 ]; then
              exit 0
            fi
            echo "Test attempt $attempt failed with exit code $status"
          done
          exit $status

  lint:
    name: SwiftLint
    runs-on: macos-latest
    # https://github.com/realm/SwiftLint?tab=readme-ov-file#setup:
    # "it is important to understand that SwiftLint is designed to analyze valid source code that is
    # compilable"
    needs: [build-and-test, build-example-app]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

  build-documentation:
    name: Build Documentation
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Build Documentation
        run: |
          xcodebuild docbuild \
            -scheme MinFraudDevice \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/docc

  check-privacy-manifest:
    name: Check Privacy Manifest
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Verify Privacy Manifest Exists
        run: |
          if [ ! -f "Sources/MinFraudDevice/Resources/PrivacyInfo.xcprivacy" ]; then
            echo "Error: Privacy Manifest not found"
            exit 1
          fi
          echo "Privacy Manifest found"

      - name: Validate Privacy Manifest Format
        run: |
          plutil -lint Sources/MinFraudDevice/Resources/PrivacyInfo.xcprivacy
          echo "Privacy Manifest is valid"
