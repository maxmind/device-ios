name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-latest

    strategy:
      matrix:
        destination:
          - "platform=iOS Simulator,arch=arm64,name=iPhone 16,OS=18.5"

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: latest-stable

    - name: Run Tests
      run: |
        xcodebuild test \
          -scheme MinFraudDevice \
          -destination "${{ matrix.destination }}" \
          | xcpretty && exit ${PIPESTATUS[0]}

  lint:
    name: SwiftLint
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Install SwiftLint
      run: brew install swiftlint

    - name: Run SwiftLint
      run: swiftlint lint --reporter github-actions-logging

  build-documentation:
    name: Build Documentation
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: latest-stable

    - name: Build Documentation
      run: |
        xcodebuild docbuild \
          -scheme MinFraudDevice \
          -destination 'generic/platform=iOS' \
          -derivedDataPath .build/docc

    - name: Upload Documentation Artifact
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: documentation
        path: docs/
        retention-days: 30

  check-privacy-manifest:
    name: Check Privacy Manifest
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Verify Privacy Manifest Exists
      run: |
        if [ ! -f "Sources/MinFraudDevice/PrivacyInfo.xcprivacy" ]; then
          echo "Error: Privacy Manifest not found"
          exit 1
        fi
        echo "Privacy Manifest found"

    - name: Validate Privacy Manifest Format
      run: |
        plutil -lint Sources/MinFraudDevice/PrivacyInfo.xcprivacy
        echo "Privacy Manifest is valid"
