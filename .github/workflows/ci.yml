name: CI

on: [push, pull_request]

permissions: {}

jobs:
  build-and-test:
    name: Build and Test (iOS ${{ matrix.ios-version }})
    runs-on: ${{ matrix.runner-image }}
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - runner-image: "macos-14"
            ios-version: "17.5"
            xcode-version: "15.4"
            destination: "platform=iOS Simulator,name=iPhone 15,OS=17.5"
          - runner-image: "macos-15"
            ios-version: "18.6"
            xcode-version: "16.4"
            destination: "platform=iOS Simulator,name=iPhone 16,OS=18.6"
          - runner-image: "macos-26"
            ios-version: "26.1"
            xcode-version: "26.3"
            destination: "platform=iOS Simulator,name=iPhone 17,OS=26.1"

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Xcode ${{ matrix.xcode-version }}
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ matrix.xcode-version }}

      - name: Run Tests
        run: |
          xcodebuild test \
            -scheme MinFraudDevice \
            -destination "${{ matrix.destination }}" \
            -resultBundlePath TestResults-iOS${{ matrix.ios-version }}.xcresult \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: test-results-ios-${{ matrix.ios-version }}
          path: TestResults-iOS${{ matrix.ios-version }}.xcresult
          retention-days: 14

  build-example-app:
    name: Build Example App (iOS ${{ matrix.ios-version }})
    runs-on: ${{ matrix.runner-image }}
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - runner-image: "macos-14"
            ios-version: "17.5"
            xcode-version: "15.4"
            destination: "platform=iOS Simulator,name=iPhone 15,OS=17.5"
          - runner-image: "macos-15"
            ios-version: "18.6"
            xcode-version: "16.4"
            destination: "platform=iOS Simulator,name=iPhone 16,OS=18.6"
          - runner-image: "macos-26"
            ios-version: "26.1"
            xcode-version: "26.3"
            destination: "platform=iOS Simulator,name=iPhone 17,OS=26.1"

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Xcode ${{ matrix.xcode-version }}
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ matrix.xcode-version }}

      - name: Build Example App
        run: |
          xcodebuild build \
            -project Example/MinFraudDeviceExample/MinFraudDeviceExample.xcodeproj \
            -scheme MinFraudDeviceExample \
            -destination "${{ matrix.destination }}" \
            | xcpretty && exit ${PIPESTATUS[0]}

  lint:
    name: SwiftLint
    runs-on: macos-latest
    # https://github.com/realm/SwiftLint?tab=readme-ov-file#setup:
    # "it is important to understand that SwiftLint is designed to analyze valid source code that is
    # compilable"
    needs: [build-and-test, build-example-app]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

  build-documentation:
    name: Build Documentation
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Build Documentation
        run: |
          xcodebuild docbuild \
            -scheme MinFraudDevice \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/docc

  check-privacy-manifest:
    name: Check Privacy Manifest
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify Privacy Manifest Exists
        run: |
          if [ ! -f "Sources/MinFraudDevice/Resources/PrivacyInfo.xcprivacy" ]; then
            echo "Error: Privacy Manifest not found"
            exit 1
          fi
          echo "Privacy Manifest found"

      - name: Validate Privacy Manifest Format
        run: |
          plutil -lint Sources/MinFraudDevice/Resources/PrivacyInfo.xcprivacy
          echo "Privacy Manifest is valid"
